    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="HortiGestão - Sistema de Gestão para Hortifruti" />

    <div id="root">
      <!-- Splash de carregamento (substituído quando o app monta) -->

        <div style="text-align:center;">

          <p style="margin-top:12px;color:#a7f3d0;font-size:14px;font-weight:700;">Carregando HortiGestão...</p>
          <div style="margin:14px auto 0;width:28px;height:28px;border:3px solid rgba(167,243,208,.25);border-top-color:#34d399;border-radius:50%;animation:hgspin .8s linear infinite;"></div>
        </div>
      </div>
      <style>@keyframes hgspin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
